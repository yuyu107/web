<script type="text/javascript">
var mcboxLoaded=false,mcboxTimer=null,isAllMode=false,currentPage=1,totalPage=1,totalCount=0,currentDatas=[];
function htmlEscape(s){s=(s===null||typeof s==='undefined')?'':String(s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}

function initMode(){isAllMode=queryValue('all')==='1';var p=parseInt(queryValue('page'),10);currentPage=(!isNaN(p)&&p>0)?p:1;if(isAllMode){document.body.className='all-mode';document.getElementById('head-title').innerHTML='全部直播';document.getElementById('head-action').innerHTML='返回推荐<span class="arrow">›</span>';document.getElementById('head-action').href='./';document.getElementById('head-action').target='_self';document.getElementById('live-title').innerHTML='我的世界直播'}else{document.getElementById('head-title').innerHTML='虎牙直播';document.getElementById('head-action').innerHTML='查看全部<span class="arrow">›</span>';document.getElementById('head-action').href='https://www.huya.com/g/1732';document.getElementById('head-action').target='_blank';document.getElementById('head-action').title='在浏览器中打开虎牙全部直播'}}
function coverUrl(item){return item.screenshot||item.screenshotUrl||item.game_screenshot||''}
function roomTitle(item){return item.roomName||item.introduction||item.room_name||'我的世界直播'}

function viewerText(n){if(n===null||typeof n==='undefined'||n==='')return '';var x=parseInt(n,10);if(isNaN(x))return String(n);if(x>=10000)return (Math.round(x/1000)/10)+'万';return String(x)}
function streamId(item){var s=item.streamName||item.stream_name||item.sStreamName||'';if(!s&&item.privateHost&&String(item.privateHost).indexOf('-')>0)s=item.privateHost;return s}
function roomId(item){return item.profileRoom||item.privateHost||item.roomId||item.room_id||item.uid||''}
function roomUrl(item){return 'room.html?room='+enc(roomId(item))+'&stream='+enc(streamId(item))+'&title='+enc(roomTitle(item))+'&nick='+enc(nickName(item))+'&count='+enc(viewerText(item.totalCount))+'&cover='+enc(coverUrl(item))}
function featureHtml(item){if(!item)return '<div class="empty-block"><div class="empty-text">暂无推荐直播</div></div>';var img=coverUrl(item);return '<a class="feature-link" href="'+roomUrl(item)+'" title="'+htmlEscape(roomTitle(item))+'">'+(img?'<img src="'+htmlEscape(img)+'" alt="" />':'')+'<span class="feature-shade"></span><span class="feature-text"><span class="feature-room">'+htmlEscape(roomTitle(item))+'</span><br /><span class="feature-meta">'+htmlEscape(nickName(item))+(viewerText(item.totalCount)?'　'+viewerText(item.totalCount)+'人气':'')+'</span></span></a>'}
function cardHtml(item){var img=coverUrl(item);return '<div class="live-card"><a href="'+roomUrl(item)+'" title="'+htmlEscape(roomTitle(item))+'"><div class="thumb">'+(img?'<img src="'+htmlEscape(img)+'" alt="" />':'')+(viewerText(item.totalCount)?'<span class="view-badge">'+viewerText(item.totalCount)+'</span>':'')+'</div><div class="card-body"><div class="card-title">'+htmlEscape(roomTitle(item))+'</div><div class="card-meta">'+htmlEscape(nickName(item))+'</div></div></a></div>'}
function updatePager(){var pager=document.getElementById('pager');if(!isAllMode){pager.style.display='none';return}pager.style.display='block';document.getElementById('page-info').innerHTML='第 '+currentPage+' / '+totalPage+' 页';var prev=document.getElementById('page-prev'),next=document.getElementById('page-next');prev.className='page-btn'+(currentPage<=1?' disabled':'');next.className='page-btn'+(currentPage>=totalPage?' disabled':'');document.getElementById('all-count').innerHTML=totalCount>0?('共 '+totalCount+' 个直播间'):''}
function goPage(n){if(n<1||n>totalPage||n===currentPage)return;location.href='?all=1&page='+n}

function mcboxLiveCallback(obj){try{var box=obj&&obj.data?obj.data:null;var datas=box?(box.datas||box.list||box):null;var tp=parseInt(box&&(box.totalPage||box.total_page||box.pageCount||box.page_count),10);var tc=parseInt(box&&(box.totalCount||box.total_count||box.total||box.count),10);totalPage=(!isNaN(tp)&&tp>0)?tp:1;totalCount=(!isNaN(tc)&&tc>=0)?tc:(datas&&datas.length?datas.length:0);renderRooms(datas)}catch(e){showError('直播数据解析失败。')}}
