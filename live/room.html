<style type="text/css">
html,body{margin:0;padding:0;background:#171717;color:#bbb;font-family:"Microsoft YaHei",Arial,sans-serif;font-size:14px}a{color:#d8a15d;text-decoration:none}#page{padding:20px 30px 40px;min-width:700px}.top{height:42px;line-height:34px;border-bottom:1px solid #303030;margin-bottom:18px;position:relative}.back{font-size:16px;color:#aaa;margin-right:20px}.title{font-size:21px;color:#ddd}.tools{position:absolute;right:0;top:0}.tools a{margin-left:18px;color:#aaa}.tools a:hover{color:#fff}.info{height:68px;background:#1d1d1d;border:1px solid #292929;padding:10px 14px;box-sizing:border-box;margin-bottom:12px}.room-title{font-size:20px;color:#eee;height:28px;line-height:28px;overflow:hidden;white-space:nowrap}.meta{height:24px;line-height:24px;color:#888}#player-wrap{height:540px;background:#000;position:relative;border:1px solid #282828}#video{display:block;width:100%;height:100%;background:#000}#cover{position:absolute;left:0;top:0;width:100%;height:100%;background:#111 center center no-repeat;background-size:cover}#shade{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;filter:alpha(opacity=48);opacity:.48}#message{position:absolute;left:8%;right:8%;top:41%;z-index:5;text-align:center;color:#ddd;font-size:16px;line-height:29px}#message small{display:block;color:#777;font-size:12px;margin-top:5px}.controls{min-height:46px;line-height:46px;background:#1d1d1d;border:1px solid #292929;border-top:0;padding:0 13px;color:#888}.btn{display:inline-block;padding:0 13px;height:28px;line-height:28px;margin-right:9px;background:#292929;border:1px solid #383838;color:#ccc;cursor:pointer;vertical-align:middle}.btn:hover{background:#333;color:#fff}#debug{margin-top:16px;padding:12px 15px;background:#1b1b1b;border:1px solid #292929;color:#707070;line-height:23px;font-size:12px}#debug strong{color:#999;font-weight:normal}.ok{color:#68a878}.bad{color:#b77a70}.wait{color:#aa9569}.note{margin-top:14px;color:#666;line-height:23px}.candidate{color:#999}
</style>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/es6-promise@4.2.8/dist/es6-promise.auto.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
<script type="text/javascript">
var params={},roomData=null,player=null,hlsPlayer=null,roomLoaded=false,profileTimer=null;
var candidates=[],candidateIndex=-1,playToken=0,autoNextTimer=null,lastError='';
function esc(s){s=(s===null||typeof s==='undefined')?'':String(s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}
function parseQuery(){var q=location.search.replace(/^\?/, '').split('&'),i,p,k,v;for(i=0;i<q.length;i++){if(!q[i])continue;p=q[i].split('=');k=decodeURIComponent(p[0]||'');v=decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '));params[k]=v}}
function dbg(name,val,cls){var el=document.getElementById(name);if(el){el.className=cls||'';el.innerHTML=esc(val)}}
function setStatus(text,cls){var m=document.getElementById('message');m.style.display='block';m.innerHTML=esc(text)+'<small>MCPCBox GitHub 直播兼容播放器 · 签名 v2</small>';dbg('debug-status',text,cls||'')}
function showInfo(){document.getElementById('room-title').innerHTML=esc(params.title||('虎牙直播间 '+(params.room||'')));document.getElementById('room-meta').innerHTML=esc((params.nick||'虎牙主播')+(params.count?('　'+params.count+'人气'):'')+(params.room?('　房间号 '+params.room):''));if(params.cover)document.getElementById('cover').style.backgroundImage='url("'+params.cover.replace(/\"/g,'')+'")'}
function add32(){var n=0,i;for(i=0;i<arguments.length;i++)n+=arguments[i]>>>0;return n>>>0}
function rol(x,n){return ((x<<n)|(x>>>(32-n)))>>>0}
function hex8le(x){var h='',i,b;for(i=0;i<4;i++){b=(x>>>(i*8))&255;h+=(b<16?'0':'')+b.toString(16)}return h}
function md5(s){var bytes=[],i,j,bitlen=s.length*8;for(i=0;i<s.length;i++)bytes.push(s.charCodeAt(i)&255);bytes.push(128);while((bytes.length%64)!=56)bytes.push(0);for(i=0;i<8;i++)bytes.push(i<4?((bitlen>>>(8*i))&255):0);var a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;var sh=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];var K=[],M=[],o,A,B,C,D,F,g,tmp;for(i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0;for(o=0;o<bytes.length;o+=64){for(j=0;j<16;j++){i=o+j*4;M[j]=(bytes[i]|(bytes[i+1]<<8)|(bytes[i+2]<<16)|(bytes[i+3]<<24))>>>0}A=a0;B=b0;C=c0;D=d0;for(i=0;i<64;i++){if(i<16){F=((B&C)|((~B)&D))>>>0;g=i}else if(i<32){F=((D&B)|((~D)&C))>>>0;g=(5*i+1)%16}else if(i<48){F=(B^C^D)>>>0;g=(3*i+5)%16}else{F=(C^(B|(~D)))>>>0;g=(7*i)%16}tmp=D;D=C;C=B;B=add32(B,rol(add32(A,F,K[i],M[g]),sh[i]));A=tmp}a0=add32(a0,A);b0=add32(b0,B);c0=add32(c0,C);d0=add32(d0,D)}return hex8le(a0)+hex8le(b0)+hex8le(c0)+hex8le(d0)}
function parseAnti(s){var q={},a=(s||'').split('&'),i,p,k,v;for(i=0;i<a.length;i++){if(!a[i])continue;p=a[i].split('=');k=p.shift();v=p.join('=');q[k]=v}return q}
function b64decode(s){try{return window.atob(decodeURIComponent(s||''))}catch(e){try{return window.atob(s||'')}catch(e2){return ''}}}
function javaConvertUid(uid){var left=((uid%16777216)*256)>>>0;var right=(Math.floor(uid/16777216)%4294967296)>>>0;return (left|right)>>>0}
function makeSignedAnti(raw,streamName,ratio){var q=parseAnti(raw),now=(new Date()).getTime();var uid=1462220000000+Math.floor(Math.random()*1145142333);var u=javaConvertUid(uid);var wsTime=Math.floor(now/1000).toString(16);var seqid=uid+now+216000000;var ctype='tars_mp',t='102',sv='2408161057';var fm=b64decode(q.fm||'');if(!fm)throw new Error('fm 解码失败');var oe=md5(String(seqid)+'|'+ctype+'|'+t);var mixed=fm.replace(/\$0/g,String(u)).replace(/\$1/g,String(streamName)).replace(/\$2/g,oe).replace(/\$3/g,wsTime);var secret=md5(mixed);var out='wsSecret='+secret+'&wsTime='+wsTime+'&seqid='+seqid+'&ctype='+ctype+'&t='+t+'&ver=1&fs='+encodeURIComponent(decodeURIComponent(q.fs||'bgct'))+'&sv='+sv+'&uuid='+Math.floor(uid/100)+'&codec=264&u='+u+'&sdk_sid='+now;if(ratio&&ratio!='0')out+='&ratio='+encodeURIComponent(ratio);return out}
function cdnRank(c){var r={TX:1,HW:2,HS:3,AL:4,WS:5,HY:6};return r[c]||20}
function buildCandidates(data){var list=data&&data.stream&&data.stream.baseSteamInfoList,i,s,flv,hls,anti;if(!list||!list.length)return [];var sorted=list.slice(0);sorted.sort(function(a,b){return cdnRank(a.sCdnType)-cdnRank(b.sCdnType)});var out=[];for(i=0;i<sorted.length;i++){s=sorted[i];try{if(s.sFlvUrl&&s.sStreamName&&s.sFlvAntiCode){anti=makeSignedAnti(s.sFlvAntiCode,s.sStreamName,'');flv=String(s.sFlvUrl).replace(/^http:/i,'https:')+'/'+s.sStreamName+'.'+(s.sFlvUrlSuffix||'flv')+'?'+anti;out.push({type:'flv',cdn:s.sCdnType||'CDN',url:flv})}}catch(e){} }for(i=0;i<sorted.length;i++){s=sorted[i];try{if(s.sHlsUrl&&s.sStreamName&&s.sHlsAntiCode){anti=makeSignedAnti(s.sHlsAntiCode,s.sStreamName,'');hls=String(s.sHlsUrl).replace(/^http:/i,'https:')+'/'+s.sStreamName+'.'+(s.sHlsUrlSuffix||'m3u8')+'?'+anti;out.push({type:'hls',cdn:s.sCdnType||'CDN',url:hls})}}catch(e2){} }return out}
function stopPlayer(){playToken++;if(autoNextTimer){window.clearTimeout(autoNextTimer);autoNextTimer=null}try{if(player){player.pause();player.unload();player.detachMediaElement();player.destroy()}}catch(e){}player=null;try{if(hlsPlayer){hlsPlayer.destroy()}}catch(e2){}hlsPlayer=null;var v=document.getElementById('video');try{v.pause();v.removeAttribute('src');v.load()}catch(e3){}}
function showPlaying(){document.getElementById('cover').style.display='none';document.getElementById('shade').style.display='none';document.getElementById('message').style.display='none'}
function scheduleNext(reason,token){if(token!==playToken)return;lastError=reason||'播放失败';dbg('debug-error',lastError,'bad');if(candidateIndex+1<candidates.length){setStatus('当前线路失败，正在自动切换下一条线路...','wait');autoNextTimer=window.setTimeout(function(){if(token===playToken)playCandidate(candidateIndex+1)},500)}else{setStatus('所有可用 FLV / HLS 线路都尝试失败。','bad');dbg('debug-stream','全部线路已尝试','bad')}}
function playFlvCandidate(c){stopPlayer();var token=playToken;dbg('debug-stream',(candidateIndex+1)+'/'+candidates.length+'　FLV / '+c.cdn,'ok');dbg('debug-url',c.url,'ok');dbg('debug-error','正在连接...','wait');if(typeof flvjs==='undefined'||!flvjs.isSupported()){scheduleNext('当前内核无法使用 flv.js',token);return}showPlaying();var v=document.getElementById('video');try{player=flvjs.createPlayer({type:'flv',isLive:true,url:c.url,cors:true,withCredentials:false},{enableWorker:false,enableStashBuffer:false,stashInitialSize:128});player.attachMediaElement(v);player.on(flvjs.Events.ERROR,function(type,detail,info){scheduleNext((info&&info.msg)?info.msg:(type+' / '+detail),token)});player.on(flvjs.Events.METADATA_ARRIVED,function(){dbg('debug-error','FLV 数据已到达','ok')});player.load();var p=player.play();if(p&&p['catch'])p['catch'](function(){dbg('debug-error','已取得视频流，请点击播放器中的播放按钮。','wait')})}catch(e){scheduleNext('建立 FLV 播放器失败：'+(e.message||e),token)}}
function playHlsCandidate(c){stopPlayer();var token=playToken;dbg('debug-stream',(candidateIndex+1)+'/'+candidates.length+'　HLS / '+c.cdn,'ok');dbg('debug-url',c.url,'ok');dbg('debug-error','正在连接 HLS...','wait');var v=document.getElementById('video');if(v.canPlayType&&v.canPlayType('application/vnd.apple.mpegurl')){try{v.src=c.url;showPlaying();v.onerror=function(){scheduleNext('浏览器原生 HLS 播放失败',token)};v.play();return}catch(e){}}if(typeof Hls==='undefined'||!Hls.isSupported()){scheduleNext('当前内核不支持 HLS.js',token);return}try{hlsPlayer=new Hls({enableWorker:false,lowLatencyMode:false});hlsPlayer.on(Hls.Events.ERROR,function(ev,data){if(data&&data.fatal)scheduleNext('HLS '+(data.type||'错误')+' / '+(data.details||''),token)});hlsPlayer.on(Hls.Events.MANIFEST_PARSED,function(){showPlaying();dbg('debug-error','HLS 清单加载成功','ok');var p=v.play();if(p&&p['catch'])p['catch'](function(){})});hlsPlayer.loadSource(c.url);hlsPlayer.attachMedia(v)}catch(e2){scheduleNext('建立 HLS 播放器失败：'+(e2.message||e2),token)}}
function playCandidate(idx){if(idx<0||idx>=candidates.length){setStatus('没有可尝试的直播线路。','bad');return}candidateIndex=idx;var c=candidates[idx];dbg('debug-candidate',(idx+1)+' / '+candidates.length,'ok');if(c.type==='flv')playFlvCandidate(c);else playHlsCandidate(c)}
function chooseStream(data){try{candidates=buildCandidates(data);candidateIndex=-1;dbg('debug-sign','本地重新计算 wsSecret','ok');dbg('debug-count',String(candidates.length),'ok');if(!candidates.length)return false;playCandidate(0);return true}catch(e){dbg('debug-error','生成签名失败：'+(e.message||e),'bad');return false}}
function mcboxRoomCallback(obj){roomLoaded=true;if(profileTimer)window.clearTimeout(profileTimer);try{if(obj&&obj.status==200&&obj.data){roomData=obj.data;dbg('debug-api','JSONP 成功','ok');if(!chooseStream(obj.data))setStatus('房间接口成功，但没有生成可用直播线路。','bad')}else setStatus('房间接口返回异常。','bad')}catch(e){setStatus('房间数据解析失败：'+(e.message||e),'bad')}}
function requestRoom(){if(!params.room){setStatus('没有取得直播间房间号。','bad');return}dbg('debug-api','正在请求 JSONP...','wait');var old=document.getElementById('room-jsonp');if(old&&old.parentNode)old.parentNode.removeChild(old);var sc=document.createElement('script');sc.type='text/javascript';sc.charset='utf-8';sc.id='room-jsonp';sc.src='https://mp.huya.com/cache.php?m=Live&do=profileRoom&roomid='+encodeURIComponent(params.room)+'&callback=mcboxRoomCallback&_='+(new Date().getTime());document.getElementsByTagName('head')[0].appendChild(sc);profileTimer=window.setTimeout(function(){if(!roomLoaded)setStatus('虎牙房间接口获取超时。','bad')},8000)}
function retry(){stopPlayer();document.getElementById('cover').style.display='block';document.getElementById('shade').style.display='block';setStatus('正在重新获取房间数据并生成新签名...','wait');roomLoaded=false;candidates=[];candidateIndex=-1;requestRoom()}
function nextLine(){if(candidates.length&&candidateIndex+1<candidates.length)playCandidate(candidateIndex+1);else setStatus('已经是最后一条线路。','bad')}
function init(){parseQuery();showInfo();dbg('debug-room',params.room||'未知','ok');dbg('debug-streamid',params.stream||'未提供',params.stream?'ok':'wait');dbg('debug-flv',(typeof flvjs==='undefined')?'未加载':'已加载 '+(flvjs.version||''),(typeof flvjs==='undefined')?'bad':'ok');dbg('debug-mse',(typeof flvjs!=='undefined'&&flvjs.isSupported())?'支持':'不支持',(typeof flvjs!=='undefined'&&flvjs.isSupported())?'ok':'bad');dbg('debug-hls',(typeof Hls==='undefined')?'未加载':'已加载',typeof Hls==='undefined'?'wait':'ok');setStatus('正在取得当前直播流...','wait');requestRoom()}
</script>
</head>
<body onload="init()">
<div id="page">
<div class="top"><a class="back" href="./">‹ 返回直播列表</a><span class="title">直播详情</span><span class="tools"><a href="javascript:retry();">刷新直播</a></span></div>
<div class="info"><div id="room-title" class="room-title">直播间</div><div id="room-meta" class="meta"></div></div>
<div id="player-wrap"><video id="video" controls="controls" autoplay="autoplay"></video><div id="cover"></div><div id="shade"></div><div id="message">正在取得当前直播流...<small>MCPCBox GitHub 直播兼容播放器 · 签名 v2</small></div></div>
<div class="controls"><span class="btn" onclick="retry();">重新签名 / 重试</span><span class="btn" onclick="nextLine();">下一线路</span><span>播放器会自动尝试多个虎牙 CDN，并在 FLV 全部失败后尝试 HLS。</span></div>
<div id="debug"><strong>诊断信息</strong><br />房间号：<span id="debug-room"></span>　列表流标识：<span id="debug-streamid"></span><br />flv.js：<span id="debug-flv"></span>　MSE：<span id="debug-mse"></span>　HLS.js：<span id="debug-hls"></span><br />房间接口：<span id="debug-api">等待</span>　签名：<span id="debug-sign">等待</span><br />候选线路：<span id="debug-count">0</span>　当前：<span id="debug-candidate">0</span><br />线路：<span id="debug-stream">等待</span><br />状态：<span id="debug-status">等待</span><br />错误：<span id="debug-error">无</span><br /><span id="debug-url" style="word-break:break-all"></span></div>
