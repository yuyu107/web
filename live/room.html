<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>直播间 - 多玩我的世界盒子</title>
<style type="text/css">
html,body{margin:0;padding:0;background:#171717;color:#bbb;font-family:"Microsoft YaHei",Arial,sans-serif;font-size:14px}a{color:#bbb;text-decoration:none}#page{padding:20px 30px 36px;min-width:700px}.top{height:42px;line-height:34px;border-bottom:1px solid #303030;margin-bottom:18px;position:relative}.back{font-size:16px;color:#aaa;margin-right:20px}.back:hover,.tools a:hover{color:#fff}.title{font-size:21px;color:#ddd}.tools{position:absolute;right:0;top:0}.tools a{margin-left:18px;color:#aaa}.info{height:68px;background:#1d1d1d;border:1px solid #292929;padding:10px 14px;box-sizing:border-box;margin-bottom:12px}.room-title{font-size:20px;color:#eee;height:28px;line-height:28px;overflow:hidden;white-space:nowrap}.meta{height:24px;line-height:24px;color:#888}#player-wrap{height:540px;background:#000;position:relative;border:1px solid #282828}#video{display:block;width:100%;height:100%;background:#000}#cover{position:absolute;left:0;top:0;width:100%;height:100%;background:#111 center center no-repeat;background-size:cover}#shade{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;filter:alpha(opacity=48);opacity:.48}#message{position:absolute;left:8%;right:8%;top:41%;z-index:5;text-align:center;color:#ddd;font-size:16px;line-height:29px}#message small{display:block;color:#777;font-size:12px;margin-top:5px}.controls{min-height:46px;line-height:46px;background:#1d1d1d;border:1px solid #292929;border-top:0;padding:0 13px;color:#888}.btn{display:inline-block;padding:0 13px;height:28px;line-height:28px;margin-right:9px;background:#292929;border:1px solid #383838;color:#ccc;cursor:pointer;vertical-align:middle}.btn:hover{background:#333;color:#fff}#runtime{display:inline-block;margin-left:3px;color:#777;vertical-align:middle}#debug{display:none;margin-top:14px;padding:12px 15px;background:#1b1b1b;border:1px solid #292929;color:#707070;line-height:23px;font-size:12px}#debug strong{color:#999;font-weight:normal}.ok{color:#68a878}.bad{color:#b77a70}.wait{color:#aa9569}.note{margin-top:12px;color:#555;font-size:12px}.playing-dot{display:inline-block;width:7px;height:7px;background:#5a9d6b;margin-right:7px;vertical-align:1px}
</style>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/es6-promise@4.2.8/dist/es6-promise.auto.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/spark-md5@3.0.2/spark-md5.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
<script type="text/javascript">
var params={},player=null,hlsPlayer=null,roomLoaded=false,profileTimer=null;
var candidates=[],candidateIndex=-1,playToken=0,autoNextTimer=null,watchTimer=null;
var lastFragAt=0,lastProgressAt=0,lastVideoTime=0,hlsNetworkRecover=0,hlsMediaRecover=0,stableFragments=0;
function esc(s){s=(s===null||typeof s==='undefined')?'':String(s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}
function parseQuery(){var q=location.search.replace(/^\?/,'').split('&'),i,p,k,v;for(i=0;i<q.length;i++){if(!q[i])continue;p=q[i].split('=');k=decodeURIComponent(p[0]||'');v=decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '));params[k]=v}}
function dbg(id,text,cls){var e=document.getElementById(id);if(e){e.className=cls||'';e.innerHTML=esc(text)}}
function setRuntime(text,cls){var e=document.getElementById('runtime');if(e){e.className=cls||'';e.innerHTML=text}}
function setOverlay(text,cls){var m=document.getElementById('message');m.style.display='block';m.innerHTML=esc(text)+'<small>MCPCBox 直播兼容播放器</small>';dbg('debug-status',text,cls||'')}
function hideOverlay(){document.getElementById('cover').style.display='none';document.getElementById('shade').style.display='none';document.getElementById('message').style.display='none'}
function showInfo(){document.getElementById('room-title').innerHTML=esc(params.title||('虎牙直播间 '+(params.room||'')));document.getElementById('room-meta').innerHTML=esc((params.nick||'虎牙主播')+(params.count?('　'+params.count+'人气'):'')+(params.room?('　房间号 '+params.room):''));if(params.cover)document.getElementById('cover').style.backgroundImage='url("'+params.cover.replace(/\"/g,'')+'")'}
function toggleDebug(force){var d=document.getElementById('debug');if(force===true)d.style.display='block';else if(force===false)d.style.display='none';else d.style.display=(d.style.display==='block'?'none':'block')}
function parseAnti(s){var q={},a=(s||'').split('&'),i,p,k,v;for(i=0;i<a.length;i++){if(!a[i])continue;p=a[i].split('=');k=p.shift();v=p.join('=');try{v=decodeURIComponent(v)}catch(e){}q[k]=v}return q}
function b64(s){try{return window.atob(s||'')}catch(e){return ''}}
function rotUid(uid){return (((uid<<8)|(uid>>>24))>>>0)}
function signedAnti(raw,streamName,ratio){var q=parseAnti(raw);var uid=12340000+Math.floor(Math.random()*10000);var u=rotUid(uid);var now=(new Date()).getTime();var seqid=uid+now;var ctype=q.ctype||'huya_live';var wsTime=q.wsTime||'';var fs=q.fs||'';var fm=b64(q.fm||'');if(!fm||!wsTime)throw new Error('fm/wsTime 缺失');var prefix=fm.split('_')[0];var inner=SparkMD5.hash(String(seqid)+'|'+ctype+'|100');var secret=SparkMD5.hash(prefix+'_'+u+'_'+streamName+'_'+inner+'_'+wsTime);return 'wsSecret='+secret+'&wsTime='+encodeURIComponent(wsTime)+'&ctype='+encodeURIComponent(ctype)+'&fs='+encodeURIComponent(fs)+'&seqid='+seqid+'&u='+u+'&sdk_sid='+now+'&ratio='+(ratio||0)+'&t=100&ver=1&sv=2401090219&codec=264'}
function cdnRank(c){var r={HS:1,TX:2,HW:3,AL:4,WS:5,HY:6};return r[c]||20}
function buildCandidates(data){var list=data&&data.stream&&data.stream.baseSteamInfoList;if(!list||!list.length)return [];var sorted=list.slice(0),out=[],i,s,anti,url;sorted.sort(function(a,b){return cdnRank(a.sCdnType)-cdnRank(b.sCdnType)});
/* 已验证盒子里 HLS/HS/XHR 可以稳定播放，因此 HLS 始终优先 */
for(i=0;i<sorted.length;i++){s=sorted[i];try{if(s.sHlsUrl&&s.sStreamName&&s.sHlsAntiCode){anti=signedAnti(s.sHlsAntiCode,s.sStreamName,0);url=String(s.sHlsUrl).replace(/^http:/i,'https:')+'/'+s.sStreamName+'.'+(s.sHlsUrlSuffix||'m3u8')+'?'+anti;out.push({type:'hls',cdn:s.sCdnType||'CDN',url:url})}}catch(e){}}
for(i=0;i<sorted.length;i++){s=sorted[i];try{if(s.sFlvUrl&&s.sStreamName&&s.sFlvAntiCode){anti=signedAnti(s.sFlvAntiCode,s.sStreamName,0);url=String(s.sFlvUrl).replace(/^http:/i,'https:')+'/'+s.sStreamName+'.'+(s.sFlvUrlSuffix||'flv')+'?'+anti;out.push({type:'flv',cdn:s.sCdnType||'CDN',url:url})}}catch(e2){}}
return out}
function clearWatch(){if(watchTimer){window.clearInterval(watchTimer);watchTimer=null}}
function stopPlayer(){playToken++;clearWatch();if(autoNextTimer){window.clearTimeout(autoNextTimer);autoNextTimer=null}try{if(player){player.pause();player.unload();player.detachMediaElement();player.destroy()}}catch(e){}player=null;try{if(hlsPlayer)hlsPlayer.destroy()}catch(e2){}hlsPlayer=null;var v=document.getElementById('video');try{v.pause();v.removeAttribute('src');v.load()}catch(e3){}}
function catchUpLive(){var v=document.getElementById('video');try{if(v&&v.buffered&&v.buffered.length){var end=v.buffered.end(v.buffered.length-1);if(end-v.currentTime>2.5)v.currentTime=Math.max(0,end-0.8)}}catch(e){}}
function startWatch(token){clearWatch();lastProgressAt=(new Date()).getTime();lastVideoTime=0;watchTimer=window.setInterval(function(){if(token!==playToken)return;var v=document.getElementById('video'),now=(new Date()).getTime();try{if(v.currentTime>lastVideoTime+0.05){lastVideoTime=v.currentTime;lastProgressAt=now}if(!v.paused&&lastFragAt&&now-lastFragAt>18000){dbg('debug-watch','18 秒未收到新分片，尝试恢复','wait');try{if(hlsPlayer)hlsPlayer.startLoad()}catch(e1){}catchUpLive()}if(!v.paused&&lastFragAt&&now-lastFragAt>35000){failNext('超过 35 秒未收到新视频分片',token)}}catch(e2){}},5000)}
function failNext(reason,token){if(token!==playToken)return;dbg('debug-error',reason||'播放失败','bad');if(candidateIndex+1<candidates.length){setRuntime('当前线路不可用，正在切换下一线路…','wait');setOverlay('正在切换直播线路…','wait');autoNextTimer=window.setTimeout(function(){if(token===playToken)playCandidate(candidateIndex+1)},900)}else{setRuntime('所有线路均失败','bad');setOverlay('所有直播线路均尝试失败，请稍后重试。','bad');dbg('debug-stream','全部线路已尝试','bad');toggleDebug(true)}}
function playFlv(c){stopPlayer();var token=playToken;stableFragments=0;dbg('debug-stream',(candidateIndex+1)+'/'+candidates.length+'　FLV / '+c.cdn,'ok');dbg('debug-url',c.url,'ok');dbg('debug-error','正在连接 FLV…','wait');setRuntime('正在连接 '+c.cdn+' 线路…','wait');if(typeof flvjs==='undefined'||!flvjs.isSupported()){failNext('flv.js 或 MSE 不可用',token);return}hideOverlay();var v=document.getElementById('video');try{player=flvjs.createPlayer({type:'flv',isLive:true,url:c.url,cors:true,withCredentials:false},{enableWorker:false,enableStashBuffer:false,stashInitialSize:128});player.attachMediaElement(v);player.on(flvjs.Events.ERROR,function(type,detail,info){failNext((info&&info.msg)?info.msg:(type+' / '+detail),token)});player.on(flvjs.Events.METADATA_ARRIVED,function(){dbg('debug-error','FLV 数据已到达','ok');setRuntime('<span class="playing-dot"></span>正在播放 · '+c.cdn+' / FLV','ok')});player.load();var p=player.play();if(p&&p['catch'])p['catch'](function(){setRuntime('视频流已连接，请点击播放按钮','wait')})}catch(e){failNext('建立 FLV 播放器失败：'+(e.message||e),token)}}
function playHls(c){stopPlayer();var token=playToken;lastFragAt=0;lastProgressAt=0;lastVideoTime=0;stableFragments=0;hlsNetworkRecover=0;hlsMediaRecover=0;dbg('debug-stream',(candidateIndex+1)+'/'+candidates.length+'　HLS / '+c.cdn+' / XHR','ok');dbg('debug-url',c.url,'ok');dbg('debug-error','正在连接 HLS…','wait');dbg('debug-last-hls','等待','wait');dbg('debug-frag','未收到','wait');setRuntime('正在连接 '+c.cdn+' / HLS…','wait');if(typeof Hls==='undefined'||!Hls.isSupported()){failNext('当前内核不支持 HLS.js',token);return}var v=document.getElementById('video');try{var cfg={enableWorker:false,lowLatencyMode:false,maxBufferLength:30,maxMaxBufferLength:60,maxBufferHole:0.5,highBufferWatchdogPeriod:4,nudgeOffset:0.1,nudgeMaxRetry:6,manifestLoadingMaxRetry:2,levelLoadingMaxRetry:4,fragLoadingMaxRetry:4,fragLoadingRetryDelay:1000,fragLoadingMaxRetryTimeout:8000};hlsPlayer=new Hls(cfg);
hlsPlayer.on(Hls.Events.ERROR,function(ev,data){if(!data)return;var code=(data.response&&data.response.code)?(' HTTP '+data.response.code):'';var detail=data.details||data.type||'HLS error';dbg('debug-last-hls',detail+code,data.fatal?'bad':'wait');
/* bufferStalledError 在这台盒子上能自行恢复，绝不因此换线路 */
if(detail==='bufferStalledError'||detail==='bufferNudgeOnStall'||detail==='bufferSeekOverHole'){dbg('debug-error','检测到短暂缓冲，正在保持当前线路并恢复','wait');setRuntime('网络缓冲中…','wait');try{hlsPlayer.startLoad()}catch(es){}catchUpLive();return}
if(!data.fatal)return;
if(data.type===Hls.ErrorTypes.NETWORK_ERROR){if(hlsNetworkRecover<3){hlsNetworkRecover++;dbg('debug-error','网络错误，重试当前线路 '+hlsNetworkRecover+'/3','wait');setRuntime('网络波动，正在恢复当前线路…','wait');window.setTimeout(function(){if(token===playToken&&hlsPlayer){try{hlsPlayer.startLoad()}catch(en){}}},1000);return}failNext('HLS 网络错误：'+detail+code,token);return}
if(data.type===Hls.ErrorTypes.MEDIA_ERROR){if(hlsMediaRecover<3){hlsMediaRecover++;dbg('debug-error','媒体错误，恢复解码 '+hlsMediaRecover+'/3','wait');setRuntime('正在恢复视频解码…','wait');try{hlsPlayer.recoverMediaError()}catch(em){}return}failNext('HLS 媒体错误：'+detail,token);return}
failNext('HLS '+detail+code,token)});
hlsPlayer.on(Hls.Events.MANIFEST_PARSED,function(){dbg('debug-error','HLS 清单已加载，等待视频分片…','wait');setRuntime('线路已连接，正在缓冲画面…','wait');var p=v.play();if(p&&p['catch'])p['catch'](function(){})});
hlsPlayer.on(Hls.Events.FRAG_LOADED,function(ev,data){lastFragAt=(new Date()).getTime();stableFragments++;hideOverlay();dbg('debug-error','视频分片已收到','ok');dbg('debug-frag',data&&data.frag?('sn '+data.frag.sn+' · 已收到 '+stableFragments+' 个分片'):('已收到 '+stableFragments+' 个分片'),'ok');if(stableFragments>=1)setRuntime('<span class="playing-dot"></span>正在播放 · '+c.cdn+' / HLS','ok')});
hlsPlayer.on(Hls.Events.FRAG_BUFFERED,function(){lastFragAt=(new Date()).getTime();hideOverlay();dbg('debug-frag','分片已进入缓冲区','ok');if(!v.paused){try{v.play()}catch(ep){}}});
hlsPlayer.loadSource(c.url);hlsPlayer.attachMedia(v);startWatch(token)}catch(e){failNext('建立 HLS 播放器失败：'+(e.message||e),token)}}
function playCandidate(idx){if(idx<0||idx>=candidates.length){setOverlay('没有可尝试的直播线路。','bad');toggleDebug(true);return}candidateIndex=idx;dbg('debug-candidate',(idx+1)+' / '+candidates.length,'ok');var c=candidates[idx];if(c.type==='hls')playHls(c);else playFlv(c)}
function chooseStream(data){try{candidates=buildCandidates(data);candidateIndex=-1;dbg('debug-sign','Streamlink 当前算法','ok');dbg('debug-count',String(candidates.length),'ok');if(!candidates.length)return false;playCandidate(0);return true}catch(e){dbg('debug-error','签名生成失败：'+(e.message||e),'bad');return false}}
function mcboxRoomCallback(obj){roomLoaded=true;if(profileTimer)window.clearTimeout(profileTimer);try{if(obj&&obj.status==200&&obj.data){dbg('debug-api','JSONP 成功','ok');if(!chooseStream(obj.data)){setOverlay('接口成功，但没有生成可用线路。','bad');toggleDebug(true)}}else{setOverlay('房间接口返回异常。','bad');toggleDebug(true)}}catch(e){setOverlay('房间数据解析失败：'+(e.message||e),'bad');toggleDebug(true)}}
function requestRoom(){if(!params.room){setOverlay('没有取得直播间房间号。','bad');toggleDebug(true);return}dbg('debug-api','正在请求 JSONP…','wait');var old=document.getElementById('room-jsonp');if(old&&old.parentNode)old.parentNode.removeChild(old);var sc=document.createElement('script');sc.type='text/javascript';sc.charset='utf-8';sc.id='room-jsonp';sc.src='https://mp.huya.com/cache.php?m=Live&do=profileRoom&roomid='+encodeURIComponent(params.room)+'&callback=mcboxRoomCallback&_='+(new Date().getTime());document.getElementsByTagName('head')[0].appendChild(sc);profileTimer=window.setTimeout(function(){if(!roomLoaded){setOverlay('虎牙房间接口超时。','bad');toggleDebug(true)}},8000)}
function retry(){stopPlayer();document.getElementById('cover').style.display='block';document.getElementById('shade').style.display='block';setOverlay('正在重新获取直播线路…','wait');setRuntime('正在重新连接…','wait');roomLoaded=false;candidates=[];candidateIndex=-1;requestRoom()}
function nextLine(){if(candidates.length&&candidateIndex+1<candidates.length)playCandidate(candidateIndex+1);else setRuntime('已经是最后一条线路','bad')}
function init(){parseQuery();showInfo();dbg('debug-room',params.room||'未知','ok');dbg('debug-flv',(typeof flvjs==='undefined')?'未加载':'已加载 '+(flvjs.version||''),(typeof flvjs==='undefined')?'bad':'ok');dbg('debug-mse',(typeof flvjs!=='undefined'&&flvjs.isSupported())?'支持':'不支持',(typeof flvjs!=='undefined'&&flvjs.isSupported())?'ok':'bad');dbg('debug-hls',(typeof Hls==='undefined')?'未加载':'已加载',typeof Hls==='undefined'?'bad':'ok');dbg('debug-md5',(typeof SparkMD5==='undefined')?'未加载':'已加载',typeof SparkMD5==='undefined'?'bad':'ok');setOverlay('正在取得当前直播流…','wait');setRuntime('正在连接直播…','wait');requestRoom()}
</script>
</head>
<body onload="init()">
<div id="page">
<div class="top"><a class="back" href="./">‹ 返回直播列表</a><span class="title">直播详情</span><span class="tools"><a href="javascript:retry();">刷新直播</a></span></div>
<div class="info"><div id="room-title" class="room-title">直播间</div><div id="room-meta" class="meta"></div></div>
<div id="player-wrap"><video id="video" controls="controls" autoplay="autoplay"></video><div id="cover"></div><div id="shade"></div><div id="message">正在取得当前直播流…<small>MCPCBox 直播兼容播放器</small></div></div>
<div class="controls"><span class="btn" onclick="retry();">重新连接</span><span class="btn" onclick="nextLine();">切换线路</span><span class="btn" onclick="toggleDebug();">诊断信息</span><span id="runtime">正在连接直播…</span></div>
<div id="debug"><strong>诊断信息</strong><br />房间号：<span id="debug-room"></span><br />flv.js：<span id="debug-flv"></span>　MSE：<span id="debug-mse"></span>　HLS.js：<span id="debug-hls"></span>　MD5：<span id="debug-md5"></span><br />房间接口：<span id="debug-api">等待</span>　签名：<span id="debug-sign">等待</span><br />候选线路：<span id="debug-count">0</span>　当前：<span id="debug-candidate">0</span><br />线路：<span id="debug-stream">等待</span><br />状态：<span id="debug-status">等待</span><br />错误：<span id="debug-error">无</span><br />HLS 最后事件：<span id="debug-last-hls">无</span>　分片：<span id="debug-frag">未收到</span><br />监控：<span id="debug-watch">正常</span><br /><span id="debug-url" style="word-break:break-all"></span></div>
<div class="note">稳定版：优先使用已验证可用的 HS/HLS 线路；短暂 bufferStalledError 只做恢复，不立即切线。</div>
</div>
</body>
</html>
